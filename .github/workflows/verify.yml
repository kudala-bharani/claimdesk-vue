        run: |
          python3 - <<'PYCODE'
          import base64, io, os, zipfile
          from pathlib import Path
          root = Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['CLAIMDESK_ARCHIVE_B64']))) as bundle:
              for entry in bundle.infolist():
                  relative = Path(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts or '.github' in relative.parts or '.git' in relative.parts:
                      raise ValueError('Unexpected archive path')
                  target = root / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(entry))
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - name: Commit verified source and static demo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m 'Publish ClaimDesk Vue portfolio with tests and static demo'
            git push origin HEAD:main
          fi
